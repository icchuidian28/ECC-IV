<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - ECC IV Queue System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 p-8">

<div x-data="adminQueue()" class="max-w-4xl mx-auto space-y-6">
    <div class="bg-white p-6 rounded-lg shadow-md flex justify-between items-center border-l-4 border-blue-500">
        <h1 class="text-2xl font-bold text-gray-800">Admin Controls</h1>
        <button @click="resetQueue()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition">
            Reset All Numbers
        </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Ticket Dispenser -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Issue Ticket</h2>
            <div class="grid grid-cols-2 gap-4">
                <template x-for="cat in categories" :key="cat.id">
                    <!-- Updated Button: Now shows the last issued number -->
                    <button @click="issueTicket(cat.id)" 
                            class="p-4 border-2 rounded-lg font-medium hover:bg-gray-50 transition flex flex-col items-center justify-center"
                            :class="cat.color">
                        <span class="text-lg tracking-wide" x-text="cat.name"></span>
                        <div class="mt-2 flex flex-col items-center">
                            <span class="text-xs text-gray-500 uppercase tracking-wider">Last Issued</span>
                            <span class="text-3xl font-black tabular-nums mt-1" x-text="formatNumber(cat.prefix, cat.latestIssued)"></span>
                        </div>
                    </button>
                </template>
            </div>
        </div>

        <!-- Current Serving Monitor -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Call Next</h2>
            <div class="space-y-4">
                <template x-for="cat in categories" :key="cat.id">
                    <div class="flex justify-between items-center p-4 bg-gray-50 rounded border">
                        <div class="flex flex-col">
                            <span class="font-medium text-gray-700 uppercase" x-text="cat.name"></span>
                            <span class="text-xs text-gray-500">Waiting: <span x-text="getWaitingCount(cat)"></span></span>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="text-3xl font-bold tabular-nums" x-text="formatNumber(cat.prefix, cat.current)"></span>
                            <button @click="callNext(cat.id)" 
                                    class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm font-semibold shadow">
                                Call Next
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('adminQueue', () => ({
        maxNumber: 999,
        categories: [], 

        init() {
            const today = new Date().toDateString(); 
            const storedDate = localStorage.getItem('ecc_queue_date');

            if (storedDate !== today) {
                this.resetToDefaults();
                localStorage.setItem('ecc_queue_date', today);
            } else {
                const savedQueue = localStorage.getItem('ecc_queue_data');
                if (savedQueue) this.categories = JSON.parse(savedQueue);
                else this.resetToDefaults();
            }

            window.addEventListener('storage', (e) => {
                if (e.key === 'ecc_queue_data') {
                    this.categories = JSON.parse(e.newValue);
                }
            });
        },

        saveState() {
            localStorage.setItem('ecc_queue_data', JSON.stringify(this.categories));
        },

        resetToDefaults() {
            this.categories = [
                { id: 'regular', name: 'Regular', prefix: 'R', color: 'border-blue-500 text-blue-700', current: 0, latestIssued: 0 },
                { id: 'priority', name: 'Priority', prefix: 'P', color: 'border-red-500 text-red-700', current: 0, latestIssued: 0 },
                { id: 'pickup', name: 'Pickup', prefix: 'U', color: 'border-green-500 text-green-700', current: 0, latestIssued: 0 },
                { id: 'multiple', name: 'Multiple', prefix: 'M', color: 'border-purple-500 text-purple-700', current: 0, latestIssued: 0 }
            ];
            this.saveState();
        },

        issueTicket(id) {
            let cat = this.categories.find(c => c.id === id);
            cat.latestIssued = cat.latestIssued >= this.maxNumber ? 1 : cat.latestIssued + 1;
            this.saveState(); 
        },

        callNext(id) {
            let cat = this.categories.find(c => c.id === id);
            if (cat.current === cat.latestIssued) {
                alert('No more tickets in this queue.');
                return;
            }
            cat.current = cat.current >= this.maxNumber ? 1 : cat.current + 1;
            this.saveState(); 
        },

        resetQueue() {
            if(confirm('Reset today\'s queue to 0?')) this.resetToDefaults();
        },

        formatNumber(prefix, num) {
            if (num === 0) return '---';
            return `${num}`; 
        },

        // Added this so the admin can also see how many people are waiting
        getWaitingCount(cat) {
            if (cat.current === cat.latestIssued) return 0;
            let diff = cat.latestIssued - cat.current;
            if (diff < 0) diff += this.maxNumber; 
            return diff;
        }
    }))
})
</script>
</body>
</html>
