<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - ECC IV Queue System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 p-8">

<div x-data="adminQueue()" class="max-w-4xl mx-auto space-y-6">
    <div class="bg-white p-6 rounded-lg shadow-md flex justify-between items-center border-l-4 border-blue-500">
        <h1 class="text-2xl font-bold text-gray-800">Admin Controls</h1>
        <button @click="resetQueue()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition">
            Reset All Numbers
        </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Ticket Dispenser -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Issue Ticket</h2>
            <div class="grid grid-cols-2 gap-4">
                <template x-for="cat in categories" :key="cat.id">
                    <div class="border-2 rounded-lg p-3 flex flex-col justify-between" :class="cat.borderClass + ' ' + cat.textClass">
                        <!-- Standard Auto-Issue -->
                        <button @click="issueTicket(cat.id)" class="flex flex-col items-center justify-center hover:bg-gray-50 transition w-full mb-3 pb-3 border-b border-gray-200">
                            <span class="text-lg tracking-wide font-bold" x-text="cat.name"></span>
                            <div class="mt-2 flex flex-col items-center">
                                <span class="text-xs text-gray-500 uppercase tracking-wider">Last Issued</span>
                                <span class="text-3xl font-black tabular-nums mt-1" x-text="formatNumber(cat.latestIssued)"></span>
                            </div>
                        </button>
                        
                        <!-- Manual Injection -->
                        <div class="flex items-center justify-between" x-data="{ num: '' }">
                            <input type="number" x-model="num" class="w-16 border border-gray-300 rounded px-2 py-1 text-sm text-gray-800 focus:outline-none focus:border-blue-500" placeholder="No.">
                            <button @click="if(num){ issueManual(cat.id, parseInt(num)); num=''; }" class="bg-gray-200 text-gray-700 px-3 py-1 rounded text-xs font-bold hover:bg-gray-300 transition">
                                + Add
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Current Serving & Waiting Pool -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Call Next / Skip Line</h2>
            <div class="space-y-4">
                <template x-for="cat in categories" :key="cat.id">
                    <div class="p-4 bg-gray-50 rounded border flex flex-col gap-3">
                        
                        <!-- Top Row: Info & Standard Call -->
                        <div class="flex justify-between items-center border-b pb-3">
                            <div class="flex flex-col gap-1">
                                <div class="flex items-center gap-2">
                                    <span class="font-bold uppercase" :class="cat.textClass" x-text="cat.name"></span>
                                    <button @click="resetCategory(cat.id)" class="text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded hover:bg-red-200 transition font-bold uppercase tracking-wider">
                                        Reset
                                    </button>
                                </div>
                                <span class="text-xs text-gray-500">Serving: <span class="font-bold text-black text-sm" x-text="formatNumber(cat.currentServing)"></span></span>
                            </div>
                            <div class="flex gap-2">
                                <button x-show="cat.currentServing > 0" @click="skipCurrent(cat.id)" 
                                        class="bg-yellow-500 text-white px-3 py-2 rounded hover:bg-yellow-600 text-xs font-semibold shadow transition">
                                    Skip
                                </button>
                                <button @click="callNext(cat.id)" 
                                        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm font-semibold shadow transition">
                                    Call Next
                                </button>
                            </div>
                        </div>

                        <!-- Bottom Row: The Waiting Pool & Skipped Pool -->
                        <div class="flex flex-col gap-3">
                            
                            <!-- Normal Waiting -->
                            <div class="flex flex-col gap-1">
                                <span class="text-[10px] font-bold text-gray-500 uppercase tracking-wide">Waiting List (<span x-text="cat.waitingList.length"></span>)</span>
                                <div class="flex flex-wrap gap-2">
                                    <span x-show="cat.waitingList.length === 0" class="text-sm text-gray-400 italic">Queue is empty</span>
                                    <template x-for="num in cat.waitingList" :key="'w-'+num">
                                        <button @click="callSpecificNumber(cat.id, num)" 
                                                class="px-3 py-1 bg-white border border-gray-300 rounded hover:bg-blue-500 hover:text-white transition font-semibold text-sm shadow-sm text-gray-700"
                                                title="Call out of order" x-text="num"></button>
                                    </template>
                                </div>
                            </div>

                            <!-- Skipped / Recall -->
                            <div class="flex flex-col gap-1 pt-2 border-t border-red-100" x-show="cat.skippedList.length > 0">
                                <span class="text-[10px] font-bold text-red-500 uppercase tracking-wide">Skipped / Recall</span>
                                <div class="flex flex-wrap gap-2">
                                    <template x-for="num in cat.skippedList" :key="'s-'+num">
                                        <button @click="callSkipped(cat.id, num)" 
                                                class="px-3 py-1 bg-red-50 border border-red-300 text-red-700 rounded hover:bg-red-500 hover:text-white transition font-semibold text-sm shadow-sm"
                                                title="Recall skipped number" x-text="num"></button>
                                    </template>
                                </div>
                            </div>

                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('adminQueue', () => ({
        maxNumber: 999,
        categories: [], 

        init() {
            const today = new Date().toDateString(); 
            const storedDate = localStorage.getItem('ecc_queue_date');
            const savedQueue = localStorage.getItem('ecc_queue_data');

            let isOldFormat = false;
            if (savedQueue) {
                let parsed = JSON.parse(savedQueue);
                // Force reset to apply the new color class names
                if (parsed.length > 0 && typeof parsed[0].borderClass === 'undefined') isOldFormat = true;
            }

            if (storedDate !== today || isOldFormat) {
                this.resetToDefaults();
                localStorage.setItem('ecc_queue_date', today);
            } else if (savedQueue) {
                this.categories = JSON.parse(savedQueue);
            } else {
                this.resetToDefaults();
            }

            window.addEventListener('storage', (e) => {
                if (e.key === 'ecc_queue_data') this.categories = JSON.parse(e.newValue);
            });
        },

        saveState() {
            localStorage.setItem('ecc_queue_data', JSON.stringify(this.categories));
        },

        resetToDefaults() {
            // Updated with specific Hex and Tailwind Colors
            this.categories = [
                { id: 'regular', name: 'Regular', prefix: 'R', borderClass: 'border-[#800000]', textClass: 'text-[#800000]', bgLightClass: 'bg-[#800000]/10', currentServing: 0, latestIssued: 0, waitingList: [], skippedList: [] },
                { id: 'priority', name: 'Priority', prefix: 'P', borderClass: 'border-sky-500', textClass: 'text-sky-700', bgLightClass: 'bg-sky-50', currentServing: 0, latestIssued: 0, waitingList: [], skippedList: [] },
                { id: 'pickup', name: 'Pickup', prefix: 'U', borderClass: 'border-yellow-500', textClass: 'text-yellow-700', bgLightClass: 'bg-yellow-50', currentServing: 0, latestIssued: 0, waitingList: [], skippedList: [] },
                { id: 'multiple', name: 'Multiple', prefix: 'M', borderClass: 'border-[#8A9A5B]', textClass: 'text-[#5B6B2F]', bgLightClass: 'bg-[#8A9A5B]/20', currentServing: 0, latestIssued: 0, waitingList: [], skippedList: [] }
            ];
            this.saveState();
        },

        issueTicket(id) {
            let cat = this.categories.find(c => c.id === id);
            cat.latestIssued = cat.latestIssued >= this.maxNumber ? 1 : cat.latestIssued + 1;
            cat.waitingList.push(cat.latestIssued); 
            this.saveState(); 
        },

        issueManual(catId, num) {
            if (!num || num <= 0) return;
            let cat = this.categories.find(c => c.id === catId);
            
            if (!cat.waitingList.includes(num) && !cat.skippedList.includes(num) && cat.currentServing !== num) {
                cat.waitingList.push(num);
                cat.waitingList.sort((a,b) => a - b); 
                if (num > cat.latestIssued && num <= this.maxNumber) cat.latestIssued = num;
                this.saveState();
            } else {
                alert('That number is already in the queue or currently serving.');
            }
        },

        callNext(id) {
            let cat = this.categories.find(c => c.id === id);
            if (cat.waitingList.length === 0) {
                alert('No tickets waiting in this queue.');
                return;
            }
            let nextNum = cat.waitingList.shift(); 
            cat.currentServing = nextNum;
            this.saveState(); 
        },

        callSpecificNumber(catId, num) {
            if(confirm(`Call number ${num} out of order?`)) {
                let cat = this.categories.find(c => c.id === catId);
                cat.waitingList = cat.waitingList.filter(n => n !== num);
                cat.currentServing = num;
                this.saveState();
            }
        },

        skipCurrent(catId) {
            let cat = this.categories.find(c => c.id === catId);
            if (cat.currentServing > 0) {
                if (!cat.skippedList.includes(cat.currentServing)) cat.skippedList.push(cat.currentServing);
                cat.currentServing = 0; 
                this.saveState();
            }
        },

        callSkipped(catId, num) {
            if(confirm(`Recall skipped number ${num}?`)) {
                let cat = this.categories.find(c => c.id === catId);
                cat.skippedList = cat.skippedList.filter(n => n !== num);
                cat.currentServing = num;
                this.saveState();
            }
        },

        resetQueue() {
            if(confirm('Reset all queues to 0?')) this.resetToDefaults();
        },

        resetCategory(catId) {
            let cat = this.categories.find(c => c.id === catId);
            if(confirm(`Are you sure you want to reset the ${cat.name} queue to 0?`)) {
                cat.currentServing = 0;
                cat.latestIssued = 0;
                cat.waitingList = [];
                cat.skippedList = [];
                this.saveState();
            }
        },

        formatNumber(num) {
            if (num === 0) return '---';
            return `${num}`; 
        }
    }))
})
</script>
</body>
</html>
