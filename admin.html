<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - ECC IV Queue System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 p-8">

<div x-data="adminQueue()" class="max-w-4xl mx-auto space-y-6">
    <div class="bg-white p-6 rounded-lg shadow-md flex justify-between items-center border-l-4 border-blue-500">
        <h1 class="text-2xl font-bold text-gray-800">Admin Controls</h1>
        <button @click="resetQueue()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition">
            Reset All Numbers
        </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Ticket Dispenser -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Issue Ticket</h2>
            <div class="grid grid-cols-2 gap-4">
                <template x-for="cat in categories" :key="cat.id">
                    <button @click="issueTicket(cat.id)" 
                            class="p-4 border-2 rounded-lg font-medium hover:bg-gray-50 transition flex flex-col items-center justify-center"
                            :class="cat.color">
                        <span class="text-lg tracking-wide" x-text="cat.name"></span>
                        <div class="mt-2 flex flex-col items-center">
                            <span class="text-xs text-gray-500 uppercase tracking-wider">Last Issued</span>
                            <span class="text-3xl font-black tabular-nums mt-1" x-text="formatNumber(cat.latestIssued)"></span>
                        </div>
                    </button>
                </template>
            </div>
        </div>

        <!-- Current Serving & Waiting Pool -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Call Next / Skip Line</h2>
            <div class="space-y-4">
                <template x-for="cat in categories" :key="cat.id">
                    <div class="p-4 bg-gray-50 rounded border flex flex-col gap-3">
                        
                        <!-- Top Row: Info & Standard Call -->
                        <div class="flex justify-between items-center border-b pb-3">
                            <div class="flex flex-col gap-1">
                                <div class="flex items-center gap-2">
                                    <span class="font-medium text-gray-700 uppercase" x-text="cat.name"></span>
                                    <!-- Individual Category Reset Button -->
                                    <button @click="resetCategory(cat.id)" class="text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded hover:bg-red-200 transition font-bold uppercase tracking-wider">
                                        Reset
                                    </button>
                                </div>
                                <span class="text-xs text-gray-500">Serving: <span class="font-bold text-black text-sm" x-text="formatNumber(cat.currentServing)"></span></span>
                            </div>
                            <button @click="callNext(cat.id)" 
                                    class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm font-semibold shadow">
                                Call Next
                            </button>
                        </div>

                        <!-- Bottom Row: The Waiting Pool (Chips) -->
                        <div class="flex flex-col gap-1">
                            <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Waiting List (<span x-text="cat.waitingList.length"></span>)</span>
                            <div class="flex flex-wrap gap-2">
                                <span x-show="cat.waitingList.length === 0" class="text-sm text-gray-400 italic">Queue is empty</span>
                                <template x-for="num in cat.waitingList" :key="num">
                                    <button @click="callSpecificNumber(cat.id, num)" 
                                            class="px-3 py-1 bg-white border border-gray-300 rounded hover:bg-blue-500 hover:text-white transition font-semibold text-sm shadow-sm"
                                            title="Click to call out of order"
                                            x-text="num">
                                    </button>
                                </template>
                            </div>
                        </div>

                    </div>
                </template>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('adminQueue', () => ({
        maxNumber: 999,
        categories: [], 

        init() {
            const today = new Date().toDateString(); 
            const storedDate = localStorage.getItem('ecc_queue_date');
            const savedQueue = localStorage.getItem('ecc_queue_data');

            let isOldFormat = false;
            if (savedQueue) {
                let parsed = JSON.parse(savedQueue);
                if (parsed.length > 0 && typeof parsed[0].waitingList === 'undefined') isOldFormat = true;
            }

            if (storedDate !== today || isOldFormat) {
                this.resetToDefaults();
                localStorage.setItem('ecc_queue_date', today);
            } else if (savedQueue) {
                this.categories = JSON.parse(savedQueue);
            } else {
                this.resetToDefaults();
            }

            window.addEventListener('storage', (e) => {
                if (e.key === 'ecc_queue_data') this.categories = JSON.parse(e.newValue);
            });
        },

        saveState() {
            localStorage.setItem('ecc_queue_data', JSON.stringify(this.categories));
        },

        resetToDefaults() {
            this.categories = [
                { id: 'regular', name: 'Regular', prefix: 'R', color: 'border-blue-500 text-blue-700', currentServing: 0, latestIssued: 0, waitingList: [] },
                { id: 'priority', name: 'Priority', prefix: 'P', color: 'border-red-500 text-red-700', currentServing: 0, latestIssued: 0, waitingList: [] },
                { id: 'pickup', name: 'Pickup', prefix: 'U', color: 'border-green-500 text-green-700', currentServing: 0, latestIssued: 0, waitingList: [] },
                { id: 'multiple', name: 'Multiple', prefix: 'M', color: 'border-purple-500 text-purple-700', currentServing: 0, latestIssued: 0, waitingList: [] }
            ];
            this.saveState();
        },

        issueTicket(id) {
            let cat = this.categories.find(c => c.id === id);
            cat.latestIssued = cat.latestIssued >= this.maxNumber ? 1 : cat.latestIssued + 1;
            cat.waitingList.push(cat.latestIssued); 
            this.saveState(); 
        },

        callNext(id) {
            let cat = this.categories.find(c => c.id === id);
            if (cat.waitingList.length === 0) {
                alert('No tickets waiting in this queue.');
                return;
            }
            let nextNum = cat.waitingList.shift(); 
            cat.currentServing = nextNum;
            this.saveState(); 
        },

        callSpecificNumber(catId, num) {
            if(confirm(`Call number ${num} out of order?`)) {
                let cat = this.categories.find(c => c.id === catId);
                cat.waitingList = cat.waitingList.filter(n => n !== num);
                cat.currentServing = num;
                this.saveState();
            }
        },

        resetQueue() {
            if(confirm('Reset all queues to 0?')) this.resetToDefaults();
        },

        // New function to reset only a specific category
        resetCategory(catId) {
            let cat = this.categories.find(c => c.id === catId);
            if(confirm(`Are you sure you want to reset the ${cat.name} queue to 0?`)) {
                cat.currentServing = 0;
                cat.latestIssued = 0;
                cat.waitingList = [];
                this.saveState();
            }
        },

        formatNumber(num) {
            if (num === 0) return '---';
            return `${num}`; 
        }
    }))
})
</script>
</body>
</html>
