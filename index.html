<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Serving - ECC IV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-900 h-screen flex flex-col" x-data="displayQueue()" @click="unlockAudio()">

<div x-show="!audioUnlocked" class="bg-red-500 text-white text-sm text-center py-1 font-semibold">
    Sound is paused. Click anywhere on this screen to enable the notification chime and voice.
</div>

<div class="flex-1 flex flex-col p-8">
    <div class="text-center mb-8 mt-4">
        <h1 class="text-5xl font-bold text-white tracking-wider uppercase">Now Serving</h1>
    </div>

    <div class="grid grid-cols-2 gap-8 flex-1">
        <template x-for="cat in categories" :key="cat.id">
            <div class="bg-white rounded-2xl shadow-2xl flex flex-col overflow-hidden border-4" :class="cat.color">
                
                <div class="py-4 text-center border-b border-gray-200" :class="'bg-' + cat.color.split('-')[1] + '-50'">
                    <h2 class="text-4xl font-bold uppercase tracking-wide" x-text="cat.name"></h2>
                </div>
                
                <div class="flex-1 flex items-center justify-center bg-gray-50 py-8">
                    <span class="text-8xl font-black tabular-nums tracking-tighter" x-text="formatNumber(cat.currentServing)"></span>
                </div>

                <div class="bg-gray-200 py-3 px-6 flex justify-center items-center text-gray-700 font-semibold text-2xl border-t-2 border-gray-300 text-center">
                    <div>
                        <span class="text-sm text-gray-500 uppercase tracking-wide block">Pending</span>
                        <!-- Combined count of standard waiting + skipped people -->
                        <span x-text="cat.waitingList.length + cat.skippedList.length"></span>
                    </div>
                </div>

            </div>
        </template>
    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('displayQueue', () => ({
        categories: [],
        audioUnlocked: false,
        audioCtx: null,
        maxNumber: 999, 

        init() {
            const savedQueue = localStorage.getItem('ecc_queue_data');
            
            if (savedQueue) {
                let parsed = JSON.parse(savedQueue);
                if (parsed.length > 0 && typeof parsed[0].skippedList === 'undefined') {
                    // Waiting for admin to overwrite data format
                } else {
                    this.categories = parsed;
                }
            }

            window.addEventListener('storage', (e) => {
                if (e.key === 'ecc_queue_data') {
                    const newData = JSON.parse(e.newValue);
                    this.checkForChangesAndAnnounce(newData);
                    this.categories = newData;
                }
            });
        },

        unlockAudio() {
            if (this.audioUnlocked) return; 
            this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            if ('speechSynthesis' in window) {
                let silentUtterance = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(silentUtterance);
            }
            
            this.audioUnlocked = true;
        },

        checkForChangesAndAnnounce(newData) {
            let announcementText = null;
            
            newData.forEach((newCat, index) => {
                if (this.categories[index] && this.categories[index].currentServing !== newCat.currentServing) {
                    // Announce only if it changed to an actual number (not 0/skipped)
                    if (newCat.currentServing !== 0) {
                        announcementText = `Now serving ${newCat.name}, number ${newCat.currentServing}`;
                    }
                }
            });

            if (announcementText && this.audioUnlocked) {
                this.playDing();
                
                setTimeout(() => {
                    this.speakAnnouncement(announcementText);
                }, 600);
            }
        },

        playDing() {
            if (!this.audioCtx) return;
            const oscillator = this.audioCtx.createOscillator();
            const gainNode = this.audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(this.audioCtx.destination);

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, this.audioCtx.currentTime); 

            gainNode.gain.setValueAtTime(1, this.audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.5);

            oscillator.start();
            oscillator.stop(this.audioCtx.currentTime + 0.5);
        },

        speakAnnouncement(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.85; 
                utterance.pitch = 1;
                window.speechSynthesis.speak(utterance);
            }
        },

        formatNumber(num) {
            if (num === 0) return '---';
            return `${num}`; 
        }
    }))
})
</script>
</body>
</html>
