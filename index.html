<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Serving - ECC IV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-900 h-screen flex flex-col overflow-hidden" x-data="displayQueue()" @click="unlockAudio()">

<div x-show="!audioUnlocked" class="bg-red-500 text-white text-sm text-center py-1 font-semibold z-50">
    Sound is paused. Click anywhere on this screen to enable the notification chime and voice.
</div>

<div class="flex-1 flex flex-col p-8" x-show="categories.length > 0" style="display: none;">
    <div class="text-center mb-6">
        <h1 class="text-4xl font-bold text-white tracking-wider uppercase">Now Serving</h1>
    </div>

    <!-- Main Layout: 2/3 Left (Active), 1/3 Right (Others) -->
    <div class="flex-1 flex gap-8">
        
        <!-- MAIN HIGHLIGHT (Recently Called) -->
        <template x-if="activeCat">
            <div class="w-2/3 bg-white rounded-3xl shadow-2xl flex flex-col overflow-hidden border-8 transition-colors duration-500" :class="activeCat.borderClass">
                
                <div class="py-8 text-center border-b border-gray-200 transition-colors duration-500" :class="activeCat.bgLightClass">
                    <span class="text-xl font-bold text-gray-500 uppercase tracking-widest block mb-2">Please Proceed To Claim</span>
                    <!-- Uses the custom text color applied to the category -->
                    <h2 class="text-7xl font-black uppercase tracking-wide" :class="activeCat.textClass" x-text="activeCat.name"></h2>
                </div>
                
                <div class="flex-1 flex items-center justify-center bg-gray-50 py-8">
                    <!-- Massive Number Display -->
                    <span class="text-[14rem] font-black tabular-nums tracking-tighter leading-none drop-shadow-lg text-gray-900" x-text="formatNumber(activeCat.currentServing)"></span>
                </div>

                <div class="bg-gray-200 py-6 flex justify-center items-center text-gray-700 font-semibold text-3xl border-t-2 border-gray-300 text-center">
                    <div>
                        <span class="text-lg text-gray-500 uppercase tracking-wide block">Pending in Queue</span>
                        <span class="text-4xl font-bold" x-text="activeCat.waitingList.length + activeCat.skippedList.length"></span>
                    </div>
                </div>
            </div>
        </template>

        <!-- SIDEBAR (Other Categories) -->
        <div class="w-1/3 flex flex-col gap-6">
            <template x-for="cat in otherCats" :key="cat.id">
                <div class="bg-white rounded-2xl shadow-xl flex flex-col overflow-hidden border-4 flex-1 transition-all duration-500" :class="cat.borderClass">
                    
                    <div class="py-3 text-center border-b border-gray-200" :class="cat.bgLightClass">
                        <!-- Uses the custom text color applied to the category -->
                        <h2 class="text-2xl font-bold uppercase tracking-wide" :class="cat.textClass" x-text="cat.name"></h2>
                    </div>
                    
                    <div class="flex-1 flex items-center justify-center bg-gray-50">
                        <span class="text-7xl font-black tabular-nums tracking-tighter text-gray-800" x-text="formatNumber(cat.currentServing)"></span>
                    </div>

                    <div class="bg-gray-200 py-2 flex justify-center items-center text-gray-700 font-semibold text-xl border-t-2 border-gray-300 text-center">
                        <span>Pending: <span x-text="cat.waitingList.length + cat.skippedList.length"></span></span>
                    </div>
                </div>
            </template>
        </div>

    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('displayQueue', () => ({
        categories: [],
        audioUnlocked: false,
        audioCtx: null,
        activeCategoryId: 'regular', 

        get activeCat() {
            if (!this.categories.length) return null;
            return this.categories.find(c => c.id === this.activeCategoryId) || this.categories[0];
        },
        get otherCats() {
            if (!this.categories.length) return [];
            return this.categories.filter(c => c.id !== this.activeCat.id);
        },

        init() {
            const savedQueue = localStorage.getItem('ecc_queue_data');
            
            if (savedQueue) {
                let parsed = JSON.parse(savedQueue);
                if (parsed.length > 0 && typeof parsed[0].borderClass === 'undefined') {
                    // Waiting for admin data format upgrade
                } else {
                    this.categories = parsed;
                }
            }

            window.addEventListener('storage', (e) => {
                if (e.key === 'ecc_queue_data') {
                    const newData = JSON.parse(e.newValue);
                    this.checkForChangesAndAnnounce(newData);
                    this.categories = newData;
                }
            });
        },

        unlockAudio() {
            if (this.audioUnlocked) return; 
            this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            if ('speechSynthesis' in window) {
                let silentUtterance = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(silentUtterance);
            }
            
            this.audioUnlocked = true;
        },

        checkForChangesAndAnnounce(newData) {
            let announcementText = null;
            let newlyActiveId = null;
            
            newData.forEach((newCat, index) => {
                if (this.categories[index] && this.categories[index].currentServing !== newCat.currentServing) {
                    if (newCat.currentServing !== 0) {
                        announcementText = `Now serving ${newCat.name}, number ${newCat.currentServing}`;
                        newlyActiveId = newCat.id; 
                    }
                }
            });

            if (newlyActiveId) {
                this.activeCategoryId = newlyActiveId;
            }

            if (announcementText && this.audioUnlocked) {
                this.playDing();
                
                setTimeout(() => {
                    this.speakAnnouncement(announcementText);
                }, 600);
            }
        },

        playDing() {
            if (!this.audioCtx) return;
            const oscillator = this.audioCtx.createOscillator();
            const gainNode = this.audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(this.audioCtx.destination);

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, this.audioCtx.currentTime); 

            gainNode.gain.setValueAtTime(1, this.audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.5);

            oscillator.start();
            oscillator.stop(this.audioCtx.currentTime + 0.5);
        },

        speakAnnouncement(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.85; 
                utterance.pitch = 1;
                window.speechSynthesis.speak(utterance);
            }
        },

        formatNumber(num) {
            if (num === 0) return '---';
            return `${num}`; 
        }
    }))
})
</script>
</body>
</html>
